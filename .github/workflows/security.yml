# Supply-chain and repository hygiene checks. Every job is a required status
# check on main (see docs/gotchas/github-security.md), so each one runs on
# every PR; the weekly run re-checks main against fresh advisory databases.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * 1" # Monday 10:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the PR when it introduces a dependency with a known high/critical
  # vulnerability. Needs Dependency graph enabled in Settings → Code security.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment the vulnerability summary on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Scans the full git history for committed secrets. Complements GitHub's
  # native secret scanning (which alerts but does not block a PR).
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Audits the workflows themselves: unpinned actions, template injection,
  # over-broad permissions, cache poisoning. Findings go to Code scanning;
  # the ruleset blocks merges on them.
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload zizmor SARIF to Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic

  # Misconfiguration scan of Dockerfiles, Compose files and other IaC.
  # Image vulnerability scans live in ci.yml next to the image build.
  trivy-config:
    name: Trivy config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-config.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
