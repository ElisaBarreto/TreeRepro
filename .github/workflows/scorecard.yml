# OpenSSF Scorecard: grades the repository's own security posture (pinned
# actions, branch protection, token permissions, …). Publishes results so the
# badge and https://scorecard.dev/viewer work; SARIF goes to Code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule: # re-grade when branch protection changes
  schedule:
    - cron: "30 9 * * 1" # Monday 09:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload Scorecard SARIF to Code scanning
      id-token: write # publish_results signs the upload to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
