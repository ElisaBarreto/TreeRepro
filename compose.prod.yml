services:
  caddy:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: treerepro-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  api:
    environment:
      # The browser origin is the site itself; deriving it from DOMAIN keeps the
      # two from drifting (a mismatch answers 403 SECURITY_INVALID_ORIGIN, RFC-02 R3).
      APP_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      # Outbound mail goes through the `mail` relay below (docs/gotchas/infra.md).
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}

  # Send-only Postfix relay: DKIM-signs mail from MAIL_DOMAIN and delivers it
  # straight to the recipients' MX. Publishes no port; only `api` reaches it.
  mail:
    image: boky/postfix:5.1.0-alpine@sha256:6e761312e833947f77af755072c0e77b67d298d127595470a79e9454008dd594
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:?set MAIL_HOSTNAME in .env}
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: treerepro
    volumes:
      - dkim-keys:/etc/opendkim/keys
    # Postfix and OpenDKIM start as root and drop to their own users.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, KILL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  backup:
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    image: treerepro-backup
    restart: on-failure
    environment:
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env}
      # Optional dead man's switch: fetched after every successful backup
      # (docs/gotchas/infra.md). Empty = no ping.
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    secrets: [db_backup_password]
    volumes:
      - backups:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  backups:
  dkim-keys:
