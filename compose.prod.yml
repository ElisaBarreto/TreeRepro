services:
  caddy:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: treerepro-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      # Access log, 30 days (Caddyfile.prod, docs/gotchas/infra.md).
      - caddy-logs:/var/log/caddy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  api:
    environment:
      # The browser origin is the site itself; deriving it from DOMAIN keeps the
      # two from drifting (a mismatch answers 403 SECURITY_INVALID_ORIGIN, RFC-02 R3).
      APP_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      # Production mail goes through a transactional provider (docs/gotchas/infra.md).
      # All required: the compose.yml defaults point at the dev Mailpit (port 1025, no auth).
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      SMTP_SECURE: ${SMTP_SECURE:?set SMTP_SECURE in .env}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}

  backup:
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    image: treerepro-backup
    restart: on-failure
    environment:
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env}
      # Optional dead man's switch: fetched after every successful backup
      # (docs/gotchas/infra.md). Empty = no ping.
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    secrets: [db_backup_password]
    volumes:
      - backups:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  backups:
  caddy-logs:
