packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
# Supply-chain guard: refuse versions published less than 7 days (10080 minutes) ago.
# Mirrors Dependabot's cooldown in .github/dependabot.yml. Exclude a package only
# for an urgent security patch, and remove the exclusion afterwards.
minimumReleaseAge: 10080
# Versions already in the lockfile when the guard was introduced (2026-09-12).
# Newest was published 2026-09-10T22:04Z, so every entry below is mature after
# 2026-09-18: delete the whole list by hand then. pnpm never prunes by age; it
# only drops an entry once the lockfile no longer resolves that exact version.
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.5.13"
  - "@biomejs/cli-darwin-arm64@2.5.13"
  - "@biomejs/cli-darwin-x64@2.5.13"
  - "@biomejs/cli-linux-arm64@2.5.13"
  - "@biomejs/cli-linux-arm64-musl@2.5.13"
  - "@biomejs/cli-linux-x64@2.5.13"
  - "@biomejs/cli-linux-x64-musl@2.5.13"
  - "@biomejs/cli-win32-arm64@2.5.13"
  - "@biomejs/cli-win32-x64@2.5.13"
  - "@rolldown/binding-android-arm-eabi@1.2.8"
  - "@rolldown/binding-android-arm64@1.2.8"
  - "@rolldown/binding-darwin-arm64@1.2.8"
