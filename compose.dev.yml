services:
  deps:
    build:
      context: .
      dockerfile: infra/docker/dev.Dockerfile
    image: treerepro-dev
    command: ["pnpm", "install", "--frozen-lockfile"]
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/root/.local/share/pnpm/store

  migrate:
    build: !reset null
    image: treerepro-dev
    command: ["pnpm", "--filter", "@treerepro/api", "db:migrate"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully

  api:
    image: treerepro-dev
    command: ["pnpm", "--filter", "@treerepro/api", "dev"]
    environment:
      NODE_ENV: development
    # RFC-64 R12: `import:records --replace` empties tables that RFC-63 R4 keeps
    # append-only, which `treerepro_app` cannot do. The migrator secret is added
    # here, in the development override only, so a production container has no
    # credential that could run a replacing import even if the code let it.
    secrets:
      [
        db_app_password,
        redis_password,
        pii_encryption_key_v1,
        pii_hmac_key,
        session_secret,
        smtp_password,
        db_migrator_password,
      ]
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    read_only: false
    ports:
      - "127.0.0.1:3000:3000"

  web:
    image: treerepro-dev
    command: ["pnpm", "--filter", "@treerepro/web", "dev"]
    environment:
      VITE_HMR_CLIENT_PORT: "80"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.31@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

  # Loopback only, like api and mailpit above: a laptop on a shared network
  # must not offer its database to the LAN (docs/gotchas/docker.md, "Reaching
  # Postgres or Redis from another machine").
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  caddy:
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started

volumes:
  node-modules:
  pnpm-store:
