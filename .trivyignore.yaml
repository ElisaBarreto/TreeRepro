# Trivy ignore list. Every entry needs a statement and an owner decision.
misconfigurations:
  - id: AVD-DS-0002 # image runs as root
    paths:
      - infra/docker/web.Dockerfile
    statement: >-
      The official caddy image runs as root so it can bind 80/443. compose.prod.yml
      confines it with read_only, cap_drop ALL + NET_BIND_SERVICE and
      no-new-privileges. Running Caddy as a dedicated user is tracked as a
      follow-up (needs setcap on the binary and ownership of /data, /config).
  - id: AVD-DS-0002 # image runs as root
    paths:
      - infra/docker/dev.Dockerfile
    statement: >-
      Development-only image; it edits bind-mounted source and a root-owned
      node_modules volume. Never deployed.
