name: treerepro

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: treerepro
  DB_USER: treerepro_app
  DB_MIGRATOR_USER: treerepro_migrator
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PII_CURRENT_KEY_VERSION: ${PII_CURRENT_KEY_VERSION:-v1}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: treerepro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [db_superuser_password, db_app_password, db_migrator_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treerepro"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$(cat /run/secrets/redis_password)" --maxmemory-policy noeviction --appendonly yes
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: treerepro-api
    command: ["node", "dist/db/migrate.js"]
    environment: *api-env
    secrets: [db_migrator_password]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: treerepro-api
    restart: unless-stopped
    environment: *api-env
    secrets: [db_app_password, redis_password, pii_encryption_key_v1, pii_hmac_key, session_secret]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

secrets:
  db_superuser_password:
    file: ./infra/secrets/db_superuser_password
  db_app_password:
    file: ./infra/secrets/db_app_password
  db_migrator_password:
    file: ./infra/secrets/db_migrator_password
  redis_password:
    file: ./infra/secrets/redis_password
  pii_encryption_key_v1:
    file: ./infra/secrets/pii_encryption_key_v1
  pii_hmac_key:
    file: ./infra/secrets/pii_hmac_key
  session_secret:
    file: ./infra/secrets/session_secret

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  internal:
