name: treerepro

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Development default; compose.prod.yml derives it from DOMAIN (issue #10).
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: treerepro
  DB_USER: treerepro_app
  DB_MIGRATOR_USER: treerepro_migrator
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PII_CURRENT_KEY_VERSION: ${PII_CURRENT_KEY_VERSION:-v1}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:-TreeRepro <no-reply@localhost>}
  SMTP_USER: ${SMTP_USER:-}
  WCVP_GBIF_DATASET_KEY: ${WCVP_GBIF_DATASET_KEY:-}
  # RFC-20 R4: who an expired invitation says to ask; empty names an administrator.
  INVITE_CONTACT_EMAIL: ${INVITE_CONTACT_EMAIL:-}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: treerepro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets: [db_superuser_password, db_app_password, db_migrator_password, db_backup_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    user: postgres
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treerepro"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  redis:
    image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command:
      - sh
      - -c
      - printf "requirepass %s\n" "$(cat /run/secrets/redis_password)" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --maxmemory-policy noeviction --appendonly yes
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    user: redis
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: treerepro-api
    command: ["node", "dist/db/migrate.js"]
    environment: *api-env
    secrets: [db_migrator_password]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  api:
    image: treerepro-api
    restart: unless-stopped
    # Trait maps are private (RFC-76 R1): mounted read-only, never in the image.
    environment: { <<: *api-env, MAPS_DIR: /maps }
    volumes: ["${MAPS_HOST_DIR:-./apps/api/maps}:/maps:ro"]
    secrets: [db_app_password, redis_password, pii_encryption_key_v1, pii_hmac_key, session_secret, smtp_password]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

secrets:
  db_superuser_password:
    file: ./infra/secrets/db_superuser_password
  db_app_password:
    file: ./infra/secrets/db_app_password
  db_migrator_password:
    file: ./infra/secrets/db_migrator_password
  db_backup_password:
    file: ./infra/secrets/db_backup_password
  redis_password:
    file: ./infra/secrets/redis_password
  pii_encryption_key_v1:
    file: ./infra/secrets/pii_encryption_key_v1
  pii_hmac_key:
    file: ./infra/secrets/pii_hmac_key
  session_secret:
    file: ./infra/secrets/session_secret
  smtp_password:
    file: ./infra/secrets/smtp_password

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  internal:
